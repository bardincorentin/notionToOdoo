name: BCIT Web Scraper

on:
  # Manual trigger with URL input
  workflow_dispatch:
    inputs:
      url:
        description: "URL du site à scraper (laisser vide pour tous les sites)"
        required: false
        default: ""
      output_dir:
        description: "Dossier de sortie"
        required: false
        default: "output"
      max_pages:
        description: "Nombre max de pages (0 = illimité)"
        required: false
        default: "200"

  # Scheduled: every Monday at 06:00 UTC
  schedule:
    - cron: "0 6 * * 1"

  # On push to main branch (only when scraper code changes)
  push:
    branches:
      - main
      - "claude/*"
    paths:
      - "bcit-web-scraper.js"
      - "scrape-all.js"
      - "sites.md"
      - "package.json"

env:
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Lint & validate the scraper code
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Syntax check scraper
        run: node --check bcit-web-scraper.js

      - name: Syntax check orchestrator
        run: node --check scrape-all.js

  # ─────────────────────────────────────────────
  # JOB 2: Scrape a single site (manual trigger)
  # ─────────────────────────────────────────────
  scrape-single:
    name: Scrape Single Site
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.url != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Run scraper
        run: |
          node bcit-web-scraper.js \
            --url "${{ github.event.inputs.url }}" \
            --output "./${{ github.event.inputs.output_dir }}" \
            --max-pages "${{ github.event.inputs.max_pages }}"

      - name: Upload generated site
        uses: actions/upload-artifact@v7
        with:
          name: bcit-site-${{ github.run_number }}
          path: ${{ github.event.inputs.output_dir }}/
          retention-days: 30

      - name: Show scraping report
        run: |
          echo "=== Scraping Report ==="
          cat "${{ github.event.inputs.output_dir }}/config.json" 2>/dev/null || echo "No config.json found"
          echo ""
          echo "=== Pages generated ==="
          find "${{ github.event.inputs.output_dir }}" -name "*.html" | wc -l
          echo "HTML pages found"

  # ─────────────────────────────────────────────
  # JOB 3: Scrape all sites (scheduled / push)
  # ─────────────────────────────────────────────
  scrape-all:
    name: Scrape All Sites
    runs-on: ubuntu-latest
    needs: lint
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.url == '')
    strategy:
      fail-fast: false
      matrix:
        site:
          - name: bcit
            url: "https://www.bcit.fr"
          - name: feelagile
            url: "https://www.feelagile.com"
          - name: isoserious
            url: "https://www.isoserious.com"
          - name: isms
            url: "https://www.isms.online"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Scrape ${{ matrix.site.name }}
        run: |
          node bcit-web-scraper.js \
            --url "${{ matrix.site.url }}" \
            --output "./output/${{ matrix.site.name }}"
        timeout-minutes: 30
        continue-on-error: true

      - name: Report ${{ matrix.site.name }}
        run: |
          echo "=== ${{ matrix.site.name }} report ==="
          cat "./output/${{ matrix.site.name }}/config.json" 2>/dev/null || echo "Scraping may have failed"
          echo "Pages:"
          find "./output/${{ matrix.site.name }}" -name "*.html" 2>/dev/null | wc -l

      - name: Upload artifact for ${{ matrix.site.name }}
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ matrix.site.name }}-${{ github.run_number }}
          path: output/${{ matrix.site.name }}/
          retention-days: 14
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  # JOB 4: Merge outputs & deploy to GitHub Pages
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: scrape-all
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.url == '')
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all site artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: site-*-${{ github.run_number }}
          path: ./downloaded-sites
          merge-multiple: false

      - name: Merge into deploy folder
        run: |
          mkdir -p ./deploy
          # Copy each site into its own subfolder
          for dir in ./downloaded-sites/site-*; do
            site_name=$(basename "$dir" | sed "s/site-//" | sed "s/-${{ github.run_number }}//")
            echo "Copying $site_name..."
            cp -r "$dir/." "./deploy/$site_name/" 2>/dev/null || true
          done

          # Generate portal index.html
          cat > ./deploy/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>BCIT Formation - Portail</title>
            <style>
              body { font-family: 'Segoe UI', sans-serif; background: #F9F7FF; color: #1a1a2e; margin: 0; padding: 2rem; }
              h1 { color: #332DA5; }
              .sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
              .card { background: #fff; border-radius: 8px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(51,45,165,0.1); border-top: 3px solid #3FAFC9; }
              .card h2 { color: #332DA5; font-size: 1.1rem; margin-bottom: 0.5rem; }
              .card a { color: #3FAFC9; font-weight: 700; }
            </style>
          </head>
          <body>
            <h1>BCIT Formation — Portail des sites</h1>
            <p>Sites récupérés et adaptés au template BCIT Formation.</p>
            <div class="sites">
              <div class="card"><h2>BCIT.fr</h2><a href="./bcit/index.html">Ouvrir →</a></div>
              <div class="card"><h2>Feel Agile</h2><a href="./feelagile/index.html">Ouvrir →</a></div>
              <div class="card"><h2>ISO Serious</h2><a href="./isoserious/index.html">Ouvrir →</a></div>
              <div class="card"><h2>ISMS Online</h2><a href="./isms/index.html">Ouvrir →</a></div>
            </div>
          </body>
          </html>
          HTMLEOF

          ls -la ./deploy/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          commit_message: "chore: deploy scraped sites [run ${{ github.run_number }}]"
